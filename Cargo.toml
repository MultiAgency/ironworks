[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/records",
    "crates/channel",
    "crates/channel-http",
    "crates/devchannel",
    "crates/devhttp",
    "crates/telegram",
    "crates/devstore",
    "crates/store",
    "crates/testkit",
    "crates/journal",
    "crates/lifecycle",
    "crates/reconcile",
    "crates/proposals",
    "crates/services",
    "crates/ironclaw",
    "crates/graders",
    "crates/eval",
    "crates/claims",
    "crates/evidence",
    "crates/page",
    "crates/site",
    "crates/cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
# Nothing mechanical checks this field — not the claims checker, not cargo — which is how it came
# to name a repository that did not exist for as long as it did. Correct it by hand when the remote
# moves; nothing else will.
repository = "https://github.com/MultiAgency/ironworks"

# Dependency budget is a design constraint, not an afterthought. The process this becomes holds
# every tenant's bearer token; the Python it borrows from has zero runtime dependencies, and that
# property is the one worth most here. Blocking HTTP (no async runtime), bundled SQLite, and
# nothing that pulls a parser generator. A new transitive dependency is a decision, not a detail.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"


# A doc link that no longer resolves is wrong in the present tense — the same rule
# `crates/claims/src/paths.rs::check_symbols` applies to citations in `.md`, applied to the ones in
# `.rs`. It is denied rather than warned **and** `cargo doc` is one of the commands
# `crates/claims/src/toolchain.rs` runs, because a denied lint nothing invokes is a control that
# looks like one and is not: neither `cargo test` nor `cargo clippy` runs rustdoc.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
