name: seam-ci

on:
  push:
  pull_request:

concurrency:
  group: seam-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Immutable action commits; Dependabot proposes reviewed updates to these pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # PINNED, AND CHECKSUMMED. `apt-get install -y shellcheck` takes whatever the runner image
      # happens to carry, so this gate's strictness drifted with Ubuntu and could not be
      # reproduced on any developer machine. Measured on 2026-08-27: the runner's copy raised
      # three SC2015 findings that shellcheck 0.11.0 does not raise, seam-ci had been red on
      # every run because of it, and five Dependabot PRs were blocked behind a failure none of
      # them caused. CONTRIBUTING already says the local check and the gate must ask the same
      # question; an unpinned install is the other way that breaks, and the harder one to see
      # because nothing in the repository names a version.
      #
      # The three findings were adjudicated rather than silenced by the bump — two are correct
      # as written (a trailing `|| true` that must not abort under `set -e`, and a `read` pair
      # whose EOF status is deliberately swallowed); the third was restructured on its own
      # merits. Bumping this pin is a decision to re-read whatever it newly reports.
      - name: Install pinned shellcheck
        run: |
          curl -fsSLo /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" \
            | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install the package from this checkout
        run: python -m pip install --no-deps .
      - name: Smoke the installed package outside the checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.util
          from multi.seam import persona, registry, services

          assert services.available() == ["account-analysis", "relationship-intelligence"]
          assert len(persona.compose_persona()) > 1_000
          assert registry.MODEL
          assert importlib.util.find_spec("multi.seam.test_bridge_operations") is None
          PY
      - run: ./deploy/ironworks test
      - run: python -m coverage xml
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-${{ matrix.python-version }}-coverage
          path: coverage.xml
          if-no-files-found: warn
