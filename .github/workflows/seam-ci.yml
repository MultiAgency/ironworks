name: seam-ci

on:
  push:
  pull_request:

concurrency:
  group: seam-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Immutable action commits; Dependabot proposes reviewed updates to these pins.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install the package from this checkout
        run: python -m pip install --no-deps .
      - name: Smoke the installed package outside the checkout
        working-directory: /tmp
        run: |
          python - <<'PY'
          import importlib.util
          from multi.seam import persona, registry, services

          assert services.available() == ["account-analysis", "relationship-intelligence"]
          assert len(persona.compose_persona()) > 1_000
          assert registry.MODEL
          assert importlib.util.find_spec("multi.seam.test_bridge_operations") is None
          PY
      - run: ./deploy/ironworks test
      - run: python -m coverage xml
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-${{ matrix.python-version }}-coverage
          path: coverage.xml
          if-no-files-found: warn
