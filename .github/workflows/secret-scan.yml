name: secret-scan

# Server-side backstop: scans every push and PR for committed secrets.
# Pairs with the local .pre-commit-config.yaml (gitleaks) and GitHub's own
# push protection. Uses the gitleaks binary directly (no org license needed).

on:
  push:
  pull_request:

# As in seam-ci.yml: both triggers fire on a PR branch, so this scanned every PR push twice.
# main keeps every run — a secret-scan result per commit is the record.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # full history, so the scan covers every commit
      - name: gitleaks
        # KEEP THIS VERSION EQUAL TO `.pre-commit-config.yaml`'s `rev`. They are two pins for one
        # tool, updated by two different mechanisms — Dependabot proposes this one, `pre-commit
        # autoupdate` moves the other — so they drift apart silently, and a secret gate that
        # passes locally and fails in CI (or worse, the reverse) is the same class as the
        # unpinned shellcheck that kept seam-ci red. Moving one means moving the other.
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        with:
          args: detect --source=. --redact --verbose
