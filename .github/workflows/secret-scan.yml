name: secret-scan

# Server-side backstop: scans every push and PR for committed secrets.
# Pairs with the local .pre-commit-config.yaml (gitleaks) and GitHub's own
# push protection. Uses the gitleaks binary directly (no org license needed).

on:
  push:
  pull_request:

# As in seam-ci.yml: both triggers fire on a PR branch, so this scanned every PR push twice.
# main keeps every run — a secret-scan result per commit is the record.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # full history, so the scan covers every commit
      - name: gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
        with:
          args: detect --source=. --redact --verbose
