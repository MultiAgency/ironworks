name: secret-scan

# Server-side backstop: scans every push and PR for committed secrets.
# Pairs with the local .pre-commit-config.yaml (gitleaks) and GitHub's own
# push protection. Uses the gitleaks binary directly (no org license needed).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history, so the scan covers every commit
      - name: gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.21.2
        with:
          args: detect --source=. --redact --verbose
