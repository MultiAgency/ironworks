name: scheduled-integration

on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-migration-and-readiness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prior: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_PASSWORD: migration-smoke-only
          POSTGRES_DB: accounts_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d accounts_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r deploy/account-intel/data/requirements.lock
      - name: Upgrade prior schema exactly once
        working-directory: deploy/account-intel/data
        env:
          ACCOUNT_DB_DSN: postgresql://postgres:migration-smoke-only@localhost:5432/accounts_smoke
          MIGRATION_SMOKE_DISPOSABLE: "1"
        run: python migration-smoke.py --prior '${{ matrix.prior }}'
      - name: Exercise liveness and readiness
        working-directory: deploy/account-intel/data
        env:
          ACCOUNT_DB_DSN: postgresql://postgres:migration-smoke-only@localhost:5432/accounts_smoke
          ACCOUNT_IDENTITIES: '{"smoke-token":"smoke-org"}'
          PORT: "8443"
        run: |
          python service.py &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8443/ready && break
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8443/health

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-dev.lock
      - run: python -m pip_audit -r deploy/account-intel/data/requirements.lock

  image-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
          - postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          - nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  egress-and-response-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run disposable real-runtime proof or report blocked
        env:
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
        run: |
          if [ -z "$NEARAI_API_KEY" ]; then
            echo '### BLOCKED: scheduled egress/recovery proof' >> "$GITHUB_STEP_SUMMARY"
            echo 'NEARAI_API_KEY is not configured; no live model proof was attempted.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error title=BLOCKED: live proof not run::NEARAI_API_KEY is not configured'
            exit 3
          fi
          ./deploy/egress/proof/run-proof.sh --service-path
