[package]
name = "ironworks-graders"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Answer-quality graders, and deliberately no regex dependency.
#
# The Python these replace expressed every rule as a regex, and this session found a defect that
# form hides well: an unbounded alternation in `_absence_as_negative` fired on abstractions
# ("there is no ambiguity") because the noun was unconstrained. Read as a named predicate over
# tokenized sentences, that bug is visible; read as one branch of a three-way alternation inside a
# raw string, it survived four experiments.
#
# Two of the Python patterns also need lookaround, which the `regex` crate cannot express at all —
# `(?<!\w)'[^'\n]*'(?!\w)` in the quote stripper. Carrying them would mean `fancy-regex` and its
# tree, on a workspace that justifies 88 lockfile crates by category.
#
# So the rules are written out. `dependencies` is empty on purpose; if that changes, the reason
# belongs here.
[dependencies]

[lints]
workspace = true
