[package]
name = "ironworks-records"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The record-store adapter. Owns an HTTP dependency, which is why it is not part of
# `ironworks-domain`: envelope construction must stay pure, because crash recovery depends on it
# being a function of its inputs.
[dependencies]
ironworks-domain = { path = "../domain" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[lints]
workspace = true
