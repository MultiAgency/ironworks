[package]
name = "ironworks-site"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The generated pages.
#
# **Generated rather than authored, and that is the control.** The digest displayed is the digest
# that produced the answer shown; hand-typing answer text into HTML is how a demo drifts from the
# system into marketing. Every page here refuses to build rather than render an answer it cannot
# bind to the records that answer was shown.
[[bin]]
name = "ironworks-site"
path = "src/main.rs"

[dependencies]
ironworks-domain = { path = "../domain" }
# The page states a refusal rate. It must be computed by **the same instrument that grades**,
# or the page is publishing a second opinion about its own answers.
ironworks-graders = { path = "../graders" }
ironworks-evidence = { path = "../evidence" }
ironworks-page = { path = "../page" }
serde_json = { workspace = true }

[lints]
workspace = true
