[package]
name = "ironworks-journal"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Owns SQLite, which is why it is its own crate: the pure domain must not be able to inherit a
# storage dependency. `bundled` pins the SQLite version IN the binary rather than inheriting
# whatever the host happens to have.
[dependencies]
ironworks-domain = { path = "../domain" }
ironworks-store = { path = "../store" }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
# One SHA-256 in the workspace. `sha2` is already in the lockfile, reached through `ironworks-domain`
# above, so naming it here adds no transitive dependency — see `src/digest.rs`.
sha2 = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
