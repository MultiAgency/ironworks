[package]
name = "ironworks-proposals"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# The confirmation buffer, and deliberately not a table in the turn journal.
#
# `ironworks-journal`'s standing rule is "identifiers only — never message text, answer text,
# records, or credentials", because a journal exists to outlive a crash and every byte in it
# survives one. A proposal is the person's exact words, held only until they confirm or abandon
# them, so it cannot live there without breaking that rule for every other row in the file.
#
# It is a buffer, not a second record store: nothing reads it to answer a question, and the
# durable home of a promoted note is the Account Service.
[dependencies]
ironworks-domain = { path = "../domain" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = { workspace = true }

[lints]
workspace = true
