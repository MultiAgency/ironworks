[package]
name = "ironworks-services"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

# The embedded services: persona fragments, skills, and service definitions. One crate because it is
# one boundary — everything a build decides to carry, compiled in, with no filesystem dependency
# and no path resolution. That is what lets `digest()` honestly fingerprint what this binary will
# actually send a model.
[dependencies]
ironworks-domain = { path = "../domain" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
