[build-system]
# Pinned exactly, like every other dependency here. 75.6.0 carried two advisories: a path
# traversal in `PackageIndex.download` (high, fixed 78.1.1) and a MANIFEST.in exclusion bypass
# via NFC/NFD collision on macOS (moderate, fixed 83.0.0). Neither is reachable from the serving
# path — this is a BUILD-time requirement and nothing under multi/seam/ imports it — but the
# second is adjacent to a property this build actually relies on: `build_support.BuildPy`
# excludes test modules from the wheel, and seam-ci asserts that exclusion held.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ironworks"
version = "0.1.0"
description = "Operator-run application layer around the pinned IronClaw runtime"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.4", "coverage==7.16.0"]

[tool.setuptools.packages.find]
include = ["multi", "multi.seam"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.pytest.ini_options]
testpaths = ["multi/seam", "deploy/lib", "deploy/account-intel/data", "multi/eval",
             "deploy/egress", "multi/verify/test_output_text_visibility.py"]
# `deploy/egress` carries one offline, stdlib-only suite (`test_connect_proxy.py`, which
# drives the real gateway over real sockets). It was tracked and collected by NOTHING until
# this line: the forty lines the network guarantee rests on, gated by the aggregate run and
# by nobody else. `deploy/egress/proof/` holds no `test_*.py` — those proofs need docker, a
# pinned image and a live key, and stay out of CI by design.
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# W: the whitespace class ruff can actually enforce here — W291/W292/W293, trailing space and
# tabs. The rest of that class is NOT in this list and that is deliberate, not an oversight:
#
# E303 (too many blank lines) and W391 (blank line at EOF) are PREVIEW rules in the pinned
# ruff==0.16.4. `E303` was selected here for a while and did nothing whatsoever — ruff printed
# `warning: Selection E303 has no effect because preview is not enabled` on every run and no
# gate read it, so the "triple blank line" this comment used to cite as the reason for the
# selection stayed ungated, and the tree accumulated twelve of them (worst: twenty-one
# consecutive blank lines in multi/seam/test_turn.py). Enabling `--preview` to reach two rules
# would enable every other unstable rule with them.
#
# Both live in `deploy/run-quality.py::whitespace_residue_guard` now, which checks every tracked
# TEXT file rather than just Python — the same edit leaves the same residue in a shell script.
# `deploy/lib/test_ci_contracts.py` asserts that nothing selected here is inert, because a rule
# that is configured and silently does nothing is worse than one that is absent.
#
# E402 + RUF100 together are what STOPS the inert-suppression class rather than just cleaning up
# after it. Thirty-seven `# noqa: E402` directives sat in this tree suppressing a rule that was
# never selected: every one was decoration, and a new module-level import after `sys.path` setup
# was gated by nothing. Selecting E402 produced ZERO new findings — the sites were all already
# annotated — so it costs no cleanup and makes the next one an error. RUF100 then fails any
# directive that has stopped doing anything, which is the property that keeps the first thirty-
# seven from coming back one at a time.
select = ["F", "E9", "B", "C90", "W", "E402", "RUF100"]

# EVERY ENTRY HERE IS NAMED, AND EVERY ONE WAS MEASURED. `"**/test_*.py" = ["B", "C901"]` used to
# head this table, which disabled all of flake8-bugbear across every test file in the tree — and
# a file-glob ignore exempts not just today's code but every function anyone adds to a matching
# file afterwards. Removing it surfaced 26 findings, of which 15 were real and are now fixed:
# eleven `assert False` (which `python -O` DELETES, so a test that should fail would pass), three
# missing `raise ... from`, and one `zip()` without `strict=` in a parity check that would have
# compared only the shorter prefix. Four of the file entries below were dead on top of that —
# suppressing codes their files no longer raise.
#
# What remains is listed per file so a new one has to be added deliberately. RUF100 is selected,
# so an entry that stops being needed does not sit here unnoticed the way those four did.
[tool.ruff.lint.per-file-ignores]
# The three star-importers of `_bridge_delivery_support`, which is a fixture module, not a
# package: F403/F405 are the star import itself and every name that comes through it.
#
# B023 (a closure over a loop variable) is also raised in `test_bridge_delivery.py`, and it is a
# FALSE POSITIVE at all five sites there, checked by hand: each closure is invoked inside the
# iteration that binds it, before the next rebind. Kept as a named per-file entry rather than
# five inline suppressions because the whole file uses that fixture shape.
"multi/seam/test_bridge_delivery.py" = ["F403", "F405", "B023"]
"multi/seam/test_bridge_operations.py" = ["F403", "F405"]
"multi/seam/test_bridge_recovery.py" = ["F403", "F405"]
# Same B023 shape, one site: `retry(lambda: post(..., tok))` is called immediately.
"multi/verify/test_egress_closed.py" = ["B023"]
# Every import in this module is an EXPORT — `__all__` is built from `globals()` and three suites
# star-import it. See the note at the top of the file.
"multi/seam/_bridge_delivery_support.py" = ["F401"]
# Complex TEST HELPERS: fake_docker/_d are table-driven stubs, `execute` is a fake DB cursor,
# `_bindings` walks an AST, `main` is a proof's top-level sequence. Named individually so a new
# complex test function is a finding rather than pre-exempted by a glob.
"deploy/account-intel/data/test_migrations.py" = ["C901"]
"deploy/lib/test_egress_status.py" = ["C901"]
"deploy/lib/test_shadowed_binding.py" = ["C901"]
"deploy/ironworks" = ["C901"]
"deploy/lib/compose-persona" = ["C901"]
"deploy/lib/egress_status.py" = ["C901"]
"deploy/lib/lifecycle.py" = ["C901"]
"multi/seam/bridge_core.py" = ["C901"]
"multi/seam/registry.py" = ["C901"]
"multi/seam/services.py" = ["C901"]
"multi/verify/test_session_revocation.py" = ["C901"]
