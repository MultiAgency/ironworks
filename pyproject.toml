[build-system]
# Pinned exactly, like every other dependency here. 75.6.0 carried two advisories: a path
# traversal in `PackageIndex.download` (high, fixed 78.1.1) and a MANIFEST.in exclusion bypass
# via NFC/NFD collision on macOS (moderate, fixed 83.0.0). Neither is reachable from the serving
# path — this is a BUILD-time requirement and nothing under multi/seam/ imports it — but the
# second is adjacent to a property this build actually relies on: `build_support.BuildPy`
# excludes test modules from the wheel, and seam-ci asserts that exclusion held.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ironworks"
version = "0.1.0"
description = "Operator-run application layer around the pinned IronClaw runtime"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.4", "coverage==7.15.4"]

[tool.setuptools.packages.find]
include = ["multi", "multi.seam"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"

[tool.pytest.ini_options]
testpaths = ["multi/seam", "deploy/lib", "deploy/account-intel/data", "multi/eval",
             "deploy/egress", "multi/verify/test_output_text_visibility.py"]
# `deploy/egress` carries one offline, stdlib-only suite (`test_connect_proxy.py`, which
# drives the real gateway over real sockets). It was tracked and collected by NOTHING until
# this line: the forty lines the network guarantee rests on, gated by the aggregate run and
# by nobody else. `deploy/egress/proof/` holds no `test_*.py` — those proofs need docker, a
# pinned image and a live key, and stay out of CI by design.
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# W + E303: the whitespace class. Two real defects — a blank line at EOF and a triple
# blank line, both left by deleting a function and a test class — shipped past every gate
# here, because ruff selected neither and nothing runs `git diff --check`. They were
# caught by hand, which is not a gate. Zero findings when added, so this pins the current
# state rather than demanding a cleanup.
select = ["F", "E9", "B", "C90", "W", "E303"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["B", "C901"]
"multi/seam/test_bridge_delivery.py" = ["B", "C901", "F403", "F405"]
"multi/seam/test_bridge_operations.py" = ["B", "C901", "F403", "F405"]
"multi/seam/test_bridge_recovery.py" = ["B", "C901", "F403", "F405"]
"multi/seam/_bridge_delivery_support.py" = ["F401"]
"deploy/ironworks" = ["C901"]
"deploy/lib/compose-persona" = ["C901"]
"deploy/lib/egress_status.py" = ["C901"]
"deploy/lib/lifecycle.py" = ["C901"]
"multi/seam/bridge_core.py" = ["C901"]
"multi/seam/registry.py" = ["C901"]
"multi/seam/services.py" = ["C901"]
"multi/verify/test_session_revocation.py" = ["C901"]
