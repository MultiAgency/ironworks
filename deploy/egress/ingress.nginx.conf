# L4 relay so the seam can still reach the runtime after it moves onto an internal network.
#
# A container on an `internal: true` network cannot publish a port to the host — measured, with
# a control, in SECURITY.md. So the published port lives on this container,
# which sits on both networks, and forwards TCP to the runtime.
#
# `stream`, not `http`: this must not parse, buffer, log or rewrite anything. It relays bytes.
# The seam's Authorization header passes through untouched and unread, which is the property
# that lets this component sit outside the trust boundary rather than inside it.
events {}

stream {
  # Docker's embedded resolver, re-checked every 30s so a container recreate is picked up
  # without restarting this one. Without `resolver` + a variable, nginx resolves `ironclaw`
  # once at startup and keeps a stale address after the runtime is recreated.
  resolver 127.0.0.11 valid=30s ipv6=off;

  server {
    listen 3000;
    proxy_connect_timeout 10s;
    # No read timeout: a model turn can legitimately run for minutes, and a relay that cuts it
    # would look exactly like the runtime failing.
    proxy_timeout 10m;
    set $upstream ironclaw:3000;
    proxy_pass $upstream;
  }
}
