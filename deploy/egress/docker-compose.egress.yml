# Egress containment overlay for the multi-tenant IronClaw instance.
#
#   cd multi/instance
#   docker compose -f docker-compose.yml -f ../../deploy/egress/docker-compose.egress.yml up -d
#
# Apply only through the verified maintenance procedure in SECURITY.md and deploy/README.md —
# in particular the one thing this design still rests on, which is that the pinned runtime
# honours `HTTPS_PROXY` for a REMOTE model provider. That is established from the pinned source
# (`ironclaw_llm::url_check::build_http_client` calls `.no_proxy()` only for loopback URLs) but
# has not been executed end to end, and applying this overlay without checking it first takes
# the fleet offline.
#
# WHAT IT DOES, in three moves:
#   1. The runtime moves onto `inner`, an `internal: true` network. Docker removes its default
#      route, so nothing leaves — verified by the controls described in SECURITY.md.
#   2. `egress` is the only way out: a CONNECT-only proxy on BOTH networks, allowing exactly
#      the model provider's host:port. Not a suffix, not a wildcard.
#   3. `ingress` restores 127.0.0.1:3020 for the seam. An internal network cannot publish a
#      port (also measured, with a control), so an L4 relay on both networks does it instead.
#
# The runtime never lands on a network with a route to the internet. Attaching it to one —
# "just for a moment, to debug" — silently removes the whole boundary.
name: multi
services:
  ironclaw:
    # `inner` ONLY. A second network here would restore the default route and the boundary
    # would be decoration. There is no valid reason for this list to grow.
    networks: [inner]
    # THE DOCKER HOST, NAMEABLE — so the two forbidden legs that name it can be MEASURED.
    # `forbidden-destinations.json` asserts the runtime cannot reach the private Account Service
    # or its database, the two destinations that hold client data. On Linux — which is what the
    # serve host runs — `host.docker.internal` does not resolve inside a container at all, so
    # those attempts died at DNS and `probe-egress.sh` scored "did not connect" as containment:
    # a passing assertion that never opened a socket. It has to live HERE rather than as a probe
    # flag, because the probe joins this container's network namespace (`--network container:`)
    # and docker refuses `--add-host` alongside that mode outright.
    #
    # It grants NO route. `inner` is `internal: true`; this only lets the leg fail for the reason
    # its label claims instead of for a missing name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # The LLM provider client keeps default proxy behaviour for remote hosts (it opts out
      # only for loopback URLs, so a self-hosted provider still goes direct). Both spellings:
      # reqwest reads the lowercase form, and some tooling in the image reads the uppercase.
      HTTPS_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      # NO exception list. `no_proxy` entries are the standard way this boundary gets quietly
      # widened later, and an empty value is the only setting that cannot be misread.
      NO_PROXY: ""
      no_proxy: ""
    ports: !reset []          # the published port moves to `ingress`; see below

  egress:
    image: python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a
    restart: unless-stopped
    command: ["python3", "/connect-proxy.py"]
    environment:
      # The ONE destination the product needs, exactly. Keep this list at one entry: every
      # addition is a new place a compromised runtime can send a client's book.
      EGRESS_ALLOW: "${EGRESS_ALLOW:-cloud-api.near.ai:443}"
    volumes:
      - ../../deploy/egress/connect-proxy.py:/connect-proxy.py:ro
    networks: [inner, edge]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  ingress:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on: [ironclaw]
    volumes:
      - ../../deploy/egress/ingress.nginx.conf:/etc/nginx/nginx.conf:ro
    # Loopback only, exactly as the runtime's own port map was: the seam is on this host.
    ports: ["127.0.0.1:3020:3000"]
    networks: [inner, edge]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # The database was already reachable only on the compose-private network; it moves to `inner`
  # with the runtime so that assumption keeps holding.
  db:
    networks: [inner]

networks:
  inner:
    internal: true      # the whole boundary is this line, plus nothing else joining `edge`
  edge: {}
