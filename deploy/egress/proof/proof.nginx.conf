# L4 relay for the disposable proof — same shape as the production ingress relay, pointed at
# the proof container. `stream`, not `http`: it parses nothing and logs no request line.
events {}

stream {
  resolver 127.0.0.11 valid=30s ipv6=off;
  server {
    listen 3000;
    proxy_connect_timeout 10s;
    proxy_timeout 10m;
    set $upstream ic:3000;
    proxy_pass $upstream;
  }
}
