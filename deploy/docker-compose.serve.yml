# Legacy production-profile topology. It does NOT provide an agent workspace.
#
# Do not use this file for the sandbox-backed product. IronClaw 1.4.0 wires persistent per-user
# workers only for `hosted-single-tenant-volume-sandboxed`, and that control plane needs a Docker
# daemon. This container intentionally has neither a daemon nor the host socket. The supported
# workspace topology is deploy/rustworks-ironclaw.service; this file remains as a record of the
# production/member-token contract probe until that old path is retired.
#
# IronClaw at the pinned revision, kept running.
#
# This is the deployment sibling of dev/docker-compose.probe.yml, and the differences are the
# point. The probe mints every secret per run, keeps its database in tmpfs, and is designed to be
# destroyed; a thing that answers messages cannot do any of that, because a restart that forgets
# every thread is a restart that loses conversations.
#
#   probe                          serve
#   secrets minted per run         read once from /etc/rustworks/serve.env
#   tmpfs database                 named volume, survives a restart
#   its own port, torn down        127.0.0.1:3997, restarted with the box
#
# It shares NOTHING with the fleet already on this host: its own project name, containers, volume
# and port. Bound to localhost only — the seam reaches it over the loopback and nothing else
# should.
name: rustworks-serve

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${SERVE_PGPW:?set in /etc/rustworks/serve.env}
      POSTGRES_DB: ironclaw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ironclaw"]
      interval: 5s
      timeout: 3s
      retries: 25
    volumes: [db-data:/var/lib/postgresql/data]
    mem_limit: 1g
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  # Why this exists is documented at length in the probe compose: from 1.4.0 the entrypoint
  # mkdir -p's into a directory root no longer owns, which fails under cap_drop: [ALL]. Creating
  # it first as the owning uid removes the failing operation. A no-op on an existing volume.
  ic-init:
    image: ${SERVE_IMAGE:?set it from IRONCLAW_PIN; no script here does this yet}
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/ironclaw-reborn/workspace"]
    volumes: [ic-data:/data]
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  ic:
    # No default tag, for the same reason the probe has none: a fallback is the one value that can
    # silently outrank the pin, and the pin is a privacy claim rather than a version string.
    image: ${SERVE_IMAGE:?set it from IRONCLAW_PIN; no script here does this yet}
    depends_on:
      db: { condition: service_healthy }
      ic-init: { condition: service_completed_successfully }
    environment:
      IRONCLAW_REBORN_PROFILE: production
      IRONCLAW_REBORN_POSTGRES_URL: postgres://postgres:${SERVE_PGPW:?}@db:5432/ironclaw
      DATABASE_SSLMODE: disable
      IRONCLAW_REBORN_ALLOW_REMOTE_POSTGRES_CLEAR_TEXT: "true"
      IRONCLAW_REBORN_SECRET_MASTER_KEY: ${SERVE_MASTER_KEY:?}
      IRONCLAW_REBORN_WEBUI_TOKEN: ${SERVE_WEBUI_TOKEN:?}
      IRONCLAW_REBORN_WEBUI_USER_ID: ${SERVE_WEBUI_USER:-reborn-cli}
      NEARAI_API_KEY: ${NEARAI_API_KEY:?a turn cannot complete without it}
      NEARAI_BASE_URL: https://cloud-api.near.ai
      IRONCLAW_REBORN_SERVE_HOST: "0.0.0.0"
      IRONCLAW_REBORN_LOG: info
      IRONCLAW_REBORN_POSTGRES_RESOURCE_GOVERNOR_SINGLETON: "true"
    ports: ["127.0.0.1:${SERVE_PORT:-3997}:3000"]
    volumes: [ic-data:/data]
    mem_limit: 4g
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]

volumes:
  db-data:
  ic-data:
